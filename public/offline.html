<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Diarinho</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Caveat:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fff5f7;
        --primary: #ec88a3;
        --fg: #4a2c3d;
        --muted: #8a6478;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 10% 10%, rgba(236, 136, 163, 0.25), transparent 50%),
          radial-gradient(circle at 90% 90%, rgba(201, 168, 224, 0.25), transparent 50%),
          var(--bg);
        color: var(--fg);
        font-family: "Quicksand", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      .blob {
        font-size: 5rem;
        margin-bottom: 1rem;
        animation: float 3s ease-in-out infinite;
      }
      h1 {
        font-family: "Caveat", cursive;
        font-size: 3.5rem;
        color: var(--primary);
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 1.1rem;
        color: var(--muted);
        max-width: 320px;
        line-height: 1.5;
        margin: 0 0 2rem;
      }
      button {
        background: var(--primary);
        color: white;
        border: 0;
        border-radius: 999px;
        padding: 0.85rem 2rem;
        font-size: 1rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 8px 20px -8px rgba(236, 136, 163, 0.5);
        transition: transform 0.2s;
      }
      button:hover { transform: scale(1.05); }
      button:active { transform: scale(0.97); }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-10px); }
      }
    </style>
  </head>
  <body>
    <div class="blob">🌸</div>
    <h1>Hmmm…</h1>
    <p>
      Parece que você está sem internet. As coisas voltam quando a conexão
      voltar — promessa de florzinha.
    </p>
    <button onclick="location.reload()">Tentar de novo</button>
  </body>
</html>
